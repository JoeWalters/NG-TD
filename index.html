<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NG-TD — Tower Defense</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-border: #334155;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
    }

    /* ---- Top bar HUD ---- */
    #hud {
      display: flex;
      align-items: center;
      gap: 24px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px 18px;
      min-width: 640px;
    }

    .stat {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .stat .label {
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .stat .value {
      font-size: 20px;
      font-weight: 600;
      color: var(--accent);
      min-width: 2.5em;
      text-align: right;
    }

    .hud-sep {
      width: 1px;
      align-self: stretch;
      background: var(--panel-border);
    }

    /* ---- Tower type selector ---- */
    #tower-types {
      display: flex;
      gap: 6px;
    }

    .type-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 13px;
    }

    .type-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: #0c2436;
    }

    /* ---- Start Wave button ---- */
    #start-wave {
      background: var(--accent);
      color: #0b1a2a;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #start-wave:hover { filter: brightness(1.1); }

    /* ---- Canvas ---- */
    #canvas-wrap {
      background: var(--bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 8px;
      line-height: 0;
    }

    #game-canvas {
      display: block;
      background: var(--bg);
      border-radius: 4px;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <header id="hud">
    <div class="stat">
      <span class="label">Cash</span>
      <span class="value" id="cash">0</span>
    </div>
    <div class="stat">
      <span class="label">Lives</span>
      <span class="value" id="lives">0</span>
    </div>
    <div class="stat">
      <span class="label">Wave</span>
      <span class="value" id="wave">0</span>
    </div>
    <span class="hud-sep"></span>
    <div id="tower-types">
      <button class="type-btn active" data-type="basic">Basic</button>
      <button class="type-btn" data-type="sniper">Sniper</button>
      <button class="type-btn" data-type="cannon">Cannon</button>
    </div>
    <span class="hud-sep"></span>
    <button id="start-wave">Start Wave</button>
  </header>

  <div id="canvas-wrap">
    <canvas id="game-canvas" width="640" height="640"></canvas>
  </div>

  <!-- Script order is fixed: config.js -> game_logic.js -> renderer_ui.js -->
  <script src="config.js"></script>
  <script src="game_logic.js"></script>
  <script src="renderer_ui.js"></script>
</body>
</html>
