<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NG-TD — Tower Defense</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-border: #334155;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(1200px 800px at 50% 0%, #16233f 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
    }

    /* ---- Top bar HUD ---- */
    #hud {
      display: flex;
      align-items: center;
      gap: 24px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px 18px;
      min-width: 640px;
    }

    .stat {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .stat .label {
      color: var(--muted);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .stat .value {
      font-size: 20px;
      font-weight: 600;
      color: var(--accent);
      min-width: 2.5em;
      text-align: right;
    }

    /* Next-wave preview: a compact summary of the upcoming wave's mix. */
    .stat .value.next-wave {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      min-width: 10em;
      text-align: left;
      white-space: nowrap;
    }

    .hud-sep {
      width: 1px;
      align-self: stretch;
      background: var(--panel-border);
    }

    /* ---- Tower type selector ---- */
    #tower-types {
      display: flex;
      gap: 6px;
    }

    .type-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.15s ease;
    }

    .type-btn:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
    .type-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: #0c2436;
      box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.3);
    }

    /* ---- Start Wave button ---- */
    #start-wave {
      background: linear-gradient(180deg, #4cc2fa, var(--accent));
      color: #0b1a2a;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.35);
      transition: filter 0.15s ease, transform 0.15s ease;
    }

    #start-wave:hover { filter: brightness(1.12); transform: translateY(-1px); }

    /* ---- Control buttons (pause / speed) ---- */
    #controls {
      display: flex;
      gap: 6px;
    }

    .ctl-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 13px;
      min-width: 44px;
      text-align: center;
    }

    .ctl-btn:hover { border-color: var(--accent); color: var(--accent); }
    .ctl-btn.active { border-color: var(--accent); color: var(--accent); background: #0c2436; }

    /* ---- Canvas ---- */
    #canvas-wrap {
      background: var(--bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 8px;
      line-height: 0;
      position: relative;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.18), 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    /* ---- Game over overlay ---- */
    #game-over {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.85);
      color: var(--text);
      border-radius: 4px;
      line-height: 1.2;
    }

    #game-over.hidden { display: none; }

    .go-title {
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
    }

    .go-sub {
      font-size: 14px;
      color: var(--muted);
    }

    #play-again {
      margin-top: 12px;
      background: var(--accent);
      color: #0b1a2a;
      border: none;
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #play-again:hover { filter: brightness(1.1); }

    /* ---- Tower HUD panel ---- */
    #tower-hud {
      position: absolute;
      left: 12px;
      bottom: 12px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 10px 14px;
      min-width: 200px;
      line-height: 1.35;
      pointer-events: none;
    }

    #tower-hud.hidden { display: none; }

    .th-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .th-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 13px;
    }

    .th-label { color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .th-value { color: var(--text); font-weight: 600; }

    .th-hint {
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
      border-top: 1px solid var(--panel-border);
      padding-top: 6px;
    }

    /* ---- Boss banner ---- */
    #boss-banner {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(220, 38, 38, 0.9);
      color: #fff;
      font-weight: 700;
      font-size: 20px;
      letter-spacing: 0.1em;
      padding: 6px 18px;
      border-radius: 6px;
      pointer-events: none;
      line-height: 1;
    }

    #boss-banner.hidden { display: none; }

    #game-canvas {
      display: block;
      background: var(--bg);
      border-radius: 4px;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <header id="hud">
    <div class="stat">
      <span class="label">Cash</span>
      <span class="value" id="cash">0</span>
    </div>
    <div class="stat">
      <span class="label">Lives</span>
      <span class="value" id="lives">0</span>
    </div>
    <div class="stat">
      <span class="label">Wave</span>
      <span class="value" id="wave">0</span>
    </div>
    <div class="stat">
      <span class="label">Next</span>
      <span class="value next-wave" id="next-wave">—</span>
    </div>
    <span class="hud-sep"></span>
    <div id="tower-types">
      <button class="type-btn active" data-type="basic">Basic</button>
      <button class="type-btn" data-type="sniper">Sniper</button>
      <button class="type-btn" data-type="cannon">Cannon</button>
      <button class="type-btn" data-type="splash">Splash</button>
      <button class="type-btn" data-type="frost">Frost</button>
    </div>
    <span class="hud-sep"></span>
    <button id="start-wave">Start Wave</button>
    <span class="hud-sep"></span>
    <div id="controls">
      <button class="ctl-btn" id="pause-btn">⏸ Pause</button>
      <button class="ctl-btn" id="speed-btn">1×</button>
    </div>
  </header>

  <div id="canvas-wrap">
    <canvas id="game-canvas" width="640" height="640"></canvas>
    <div id="tower-hud" class="hidden">
      <div class="th-title" id="th-title">—</div>
      <div class="th-row"><span class="th-label">Lv</span><span class="th-value" id="th-level">—</span></div>
      <div class="th-row"><span class="th-label">Dmg</span><span class="th-value" id="th-damage">—</span></div>
      <div class="th-row"><span class="th-label">Rng</span><span class="th-value" id="th-range">—</span></div>
      <div class="th-row"><span class="th-label">Mode</span><span class="th-value" id="th-mode">—</span></div>
      <div class="th-row"><span class="th-label">Upg</span><span class="th-value" id="th-upgrade">—</span></div>
      <div class="th-hint">L-click: upgrade · R-click: sell · M: cycle mode</div>
    </div>
    <div id="boss-banner" class="hidden">⚠ BOSS</div>
    <div id="game-over" class="hidden">
      <div class="go-title">Game Over</div>
      <div class="go-sub">Reached wave <span id="game-over-wave">0</span></div>
      <button id="play-again">Play Again</button>
    </div>
  </div>

  <!-- Script order is fixed: config.js -> game_logic.js -> renderer_ui.js -->
  <script src="config.js"></script>
  <script src="game_logic.js"></script>
  <script src="renderer_ui.js"></script>
</body>
</html>
